url: https://iomedhealth.github.io/omopHeor/
template:
  bootstrap: 5
  bslib:
    bootswatch: united
    primary: "#0F3BFE"
    bg: "#ffffff"
    fg: "#2d3748"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
footer:
  structure:
    left: copyright
    right: built_with
  components:
    copyright: "Developed and Copyrighted by [IOMED](https://iomed.health)."
articles:
  - title: "Getting Started"
    navbar: "Getting Started"
    contents:
      - omopheor-ecosystem
      - intro-to-heor
      - cohort-utilization
  - title: "Deep Dives"
    navbar: "Deep Dives"
    contents:
      - hcru_logic
reference:
  - title: "Stage 1: Cohort Generation"
    desc: "Functions for defining, initializing, and building care episodes."
    contents:
      - CohortEconomics::init
      - CohortUtilisation::compute_hospitalization_cohorts
      - CohortUtilisation::computeInfusionCohorts
  - title: "Stage 2: Cohort Utilization & Cost Enrichers"
    desc: "In-database cohort enrichment verbs following PatientProfiles patterns."
    contents:
      - CohortUtilisation::addInpatients
      - CohortUtilisation::addEmergencyCare
      - CohortUtilisation::addOutpatientVisits
      - CohortUtilisation::addVisits
      - CohortUtilisation::addPrescriptions
      - CohortUtilisation::addProcedures
      - CohortCosts::addCosts
  - title: "Stage 2: Summarisation & Reporting"
    desc: "Standardised result summaries and publication-ready table & plot formatters."
    contents:
      - CohortUtilisation::summariseUtilization
      - CohortCosts::summariseCosts
      - CohortUtilisation::tableUtilization
      - CohortCosts::tableCosts
      - CohortUtilisation::plotUtilization
      - CohortCosts::plotCosts
      - CohortEconomics::summarise_baseline
      - CohortEconomics::extract_hcru
  - title: "Stage 3: Propensity Score"
    desc: "Causal adjustment and matching."
    contents:
      - CohortEconomics::fit_ps
      - CohortEconomics::adjust_ps
      - CohortEconomics::assess_balance
  - title: "Stage 4: Trajectories"
    desc: "State-cost extraction and transitions."
    contents:
      - CohortEconomics::compile_trajectories
  - title: "Stage 5 & 6: Simulation & CEA"
    desc: "Economic simulation and decision analysis."
    contents:
      - CohortEconomics::simulate_economics
      - CohortEconomics::run_cea
      - CohortEconomics::plot_ceac
      - CohortEconomics::plot_plane
      - CohortEconomics::table_summary
  - title: "Mock Data & Testing Utilities"
    desc: "Helpers for creating synthetic in-memory OMOP CDM test references."
    contents:
      - mockOmopHeor
      - mockHERMES
