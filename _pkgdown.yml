url: https://iomedhealth.github.io/hermes/
template:
  bootstrap: 5
  bslib:
    bootswatch: united
    primary: "#0F3BFE"
    bg: "#ffffff"
    fg: "#2d3748"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
footer:
  structure:
    left: copyright
    right: built_with
  components:
    copyright: "Developed and Copyrighted by [IOMED](https://iomed.health)."
articles:
  - title: "Getting Started"
    navbar: "Getting Started"
    contents:
      - hermes-ecosystem
      - intro-to-heor
      - cohort-utilization
  - title: "Deep Dives"
    navbar: "Deep Dives"
    contents:
      - hcru_logic
reference:
  - title: "Healthcare Resource Utilization (CohortUtilisation)"
    desc: "In-database care episode constructors and cohort enrichment verbs following DARWIN EU standards."

  - subtitle: "Care Episode Constructors (Layer 1)"
    desc: "Constructs collapsed inpatient and infusion therapy episode cohorts in the database write schema."
    contents:
      - computeHospitalizationCohorts
      - compute_hospitalization_cohorts
      - computeInfusionCohorts

  - subtitle: "In-Database Cohort Enrichers (Layer 2)"
    desc: "Enriches OMOP cohorts with utilization metric columns across fixed or open-ended temporal windows."
    contents:
      - addInpatients
      - addHospitalizations
      - addInpatient
      - addEmergencyCare
      - addEmergency
      - addEmergencyVisits
      - addOutpatientVisits
      - addVisits
      - addPrescriptions
      - addProcedures

  - subtitle: "Analytics, Tables & Visualizations (Layer 3)"
    desc: "Aggregates metrics into standardised results and formats publication-ready tables and figures."
    contents:
      - summariseUtilization
      - tableUtilization
      - plotUtilization

  - title: "Direct Medical Costs & Tariffs (CohortCosts)"
    desc: "Direct medical expenditure tracking, polymorphic OMOP COST linkage, and tariff modeling."

  - subtitle: "Cost Enrichment & Reporting"
    contents:
      - addCosts
      - summariseCosts
      - tableCosts
      - plotCosts

  - title: "Health Economics, Simulation & CEA (CohortEconomics)"
    desc: "The complete 6-stage HEOR pipeline: causal inference, Markov health-state trajectories, and CEA."

  - subtitle: "Stage 1: Cohort Setup & Initialization"
    contents:
      - init

  - subtitle: "Stage 2: Baseline & HCRU Extraction"
    contents:
      - summarise_baseline
      - extract_hcru
      - extractHcru

  - subtitle: "Stage 3: Causal Propensity Score Adjustment"
    contents:
      - fit_ps
      - adjust_ps
      - assess_balance

  - subtitle: "Stage 4 & 5: Trajectories & Markov Simulation"
    contents:
      - compile_trajectories
      - simulate_economics

  - subtitle: "Stage 6: Decision Analysis & Post-Processing"
    contents:
      - run_cea
      - plot_ceac
      - plot_plane
      - table_summary

  - title: "Demonstration & Testing Utilities"
    desc: "Built-in synthetic in-memory DuckDB OMOP CDM reference for demonstrations and tests."
    contents:
      - mockHERMES
